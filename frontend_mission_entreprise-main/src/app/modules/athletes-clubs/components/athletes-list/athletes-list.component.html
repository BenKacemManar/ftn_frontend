<div class="min-h-screen bg-ftn-bg">
  <div class="hero-animated px-6 pt-9 pb-7">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-end justify-between gap-4">
      <div>
        <p class="text-xs font-bold uppercase tracking-widest mb-1" style="color:rgba(0,200,240,.85)">Athlètes</p>
        <h1 class="text-3xl font-extrabold text-white mb-1">Nos Athlètes</h1>
        <p class="text-sm" style="color:rgba(255,255,255,.55)">Licenciés FTN — saison en cours</p>
      </div>
      <a routerLink="/athletes/clubs"
         class="inline-flex items-center gap-2 px-4 py-2 text-sm font-bold text-white rounded-xl no-underline"
         style="background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2)">
        🏛️ Voir les clubs
      </a>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 py-6">
    <!-- Filters -->
    <div class="bg-white rounded-xl border border-ftn-border p-4 flex flex-wrap gap-3 items-end mb-6 shadow-card">
      <div class="flex flex-col gap-1">
        <label class="text-[10px] font-bold uppercase tracking-widest text-ftn-muted">Recherche</label>
        <input type="text" [(ngModel)]="search" (input)="applyFilter()" placeholder="Nom, prénom…"
               class="text-sm border border-ftn-border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" style="min-width:180px"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-[10px] font-bold uppercase tracking-widest text-ftn-muted">Catégorie</label>
        <select [(ngModel)]="selectedCategory" (change)="applyFilter()"
                class="text-sm border border-ftn-border rounded-lg px-3 py-2">
          <option *ngFor="let c of categories" [value]="c">{{ c || 'Toutes' }}</option>
        </select>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-[10px] font-bold uppercase tracking-widest text-ftn-muted">Genre</label>
        <select [(ngModel)]="selectedGender" (change)="applyFilter()"
                class="text-sm border border-ftn-border rounded-lg px-3 py-2">
          <option *ngFor="let g of genders" [value]="g.value">{{ g.label }}</option>
        </select>
      </div>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="flex justify-center py-24">
      <div class="w-10 h-10 border-4 border-ftn-surface border-t-primary rounded-full animate-spin"></div>
    </div>

    <!-- Grid -->
    <div *ngIf="!loading" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <div *ngFor="let a of athletes"
           class="bg-white rounded-2xl border border-ftn-border p-4 flex flex-col items-center gap-2 shadow-card hover:shadow-card-hover hover:-translate-y-0.5 transition-all duration-200 cursor-pointer">
        <div class="w-14 h-14 rounded-full flex items-center justify-center text-xl font-extrabold text-white"
             style="background: linear-gradient(135deg,#0057FF,#00C8F0)">
          {{ getInitials(a.nom, a.prenom) }}
        </div>
        <div class="text-center">
          <p class="font-bold text-gray-900 text-sm leading-tight">{{ a.prenom }} {{ a.nom }}</p>
          <p class="text-xs text-ftn-muted mt-0.5">{{ a.categorie }}</p>
          <p class="text-xs text-ftn-muted">{{ a.clubNom || '—' }}</p>
        </div>
        <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full"
              [class.bg-blue-100]="a.sexe === 'M'" [class.text-blue-700]="a.sexe === 'M'"
              [class.bg-pink-100]="a.sexe === 'F'" [class.text-pink-700]="a.sexe === 'F'"
              [class.bg-gray-100]="!a.sexe" [class.text-gray-500]="!a.sexe">
          {{ a.sexe === 'M' ? 'Homme' : a.sexe === 'F' ? 'Femme' : '—' }}
        </span>
      </div>
    </div>

    <div *ngIf="!loading && athletes.length === 0"
         class="bg-white rounded-2xl border border-ftn-border py-24 flex flex-col items-center gap-3">
      <span class="text-5xl" style="opacity:.1">🏊</span>
      <p class="font-semibold text-ftn-muted">Aucun athlète trouvé.</p>
    </div>

    <app-pagination [total]="total" [page]="page" [pageSize]="pageSize" (pageChange)="onPageChange($event)" class="mt-6 block"></app-pagination>
  </div>
</div>
