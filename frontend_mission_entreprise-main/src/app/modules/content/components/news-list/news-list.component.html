<div class="min-h-screen bg-ftn-bg">
  <div class="hero-animated px-6 pt-9 pb-7">
    <div class="max-w-7xl mx-auto">
      <p class="text-xs font-bold uppercase tracking-widest mb-1" style="color:rgba(0,200,240,.85)">FTN</p>
      <h1 class="text-3xl font-extrabold text-white mb-1">Actualités & Annonces</h1>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 py-6">
    <!-- Filter -->
    <div class="bg-white rounded-xl border border-ftn-border p-4 flex flex-wrap gap-2 items-center mb-6 shadow-card">
      <button *ngFor="let c of categories"
              (click)="selectedCategory = c; applyFilter()"
              class="px-4 py-1.5 rounded-full text-xs font-bold border transition-all cursor-pointer"
              [class.bg-blue-600]="selectedCategory === c" [class.text-white]="selectedCategory === c"
              [class.border-blue-600]="selectedCategory === c"
              [class.bg-white]="selectedCategory !== c" [class.text-ftn-muted]="selectedCategory !== c"
              [class.border-ftn-border]="selectedCategory !== c">
        {{ c || 'Toutes' }}
      </button>
      <span class="ml-auto text-xs text-ftn-muted">{{ news.length }} article{{ news.length !== 1 ? 's' : '' }}</span>
    </div>

    <div *ngIf="loading" class="flex justify-center py-24">
      <div class="w-10 h-10 border-4 border-ftn-surface border-t-primary rounded-full animate-spin"></div>
    </div>

    <div *ngIf="!loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <div *ngFor="let item of news"
           (click)="goToDetail(item.id)"
           class="bg-white rounded-2xl border border-ftn-border overflow-hidden shadow-card hover:shadow-card-hover hover:-translate-y-0.5 transition-all duration-200 cursor-pointer">
        <div *ngIf="item.imageUrl" class="h-40 overflow-hidden">
          <img [src]="item.imageUrl" [alt]="item.titre" class="w-full h-full object-cover"/>
        </div>
        <div *ngIf="!item.imageUrl" class="h-40 flex items-center justify-center" style="background:#EEF4FF">
          <span class="text-5xl" style="opacity:.15">📰</span>
        </div>
        <div class="p-4">
          <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-blue-100 text-blue-700 mb-2">
            {{ item.categorie }}
          </span>
          <h3 class="font-extrabold text-gray-900 text-sm leading-snug mb-2 line-clamp-2">{{ item.titre }}</h3>
          <p class="text-xs text-ftn-muted">{{ formatDate(item.datePublication || item.createdAt) }}</p>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && news.length === 0"
         class="bg-white rounded-2xl border border-ftn-border py-24 flex flex-col items-center gap-3">
      <span class="text-5xl" style="opacity:.1">📰</span>
      <p class="font-semibold text-ftn-muted">Aucune actualité disponible.</p>
    </div>
  </div>
</div>
