<div class="min-h-screen bg-gradient-to-br from-blue-900 to-blue-700 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Créer un compte</h1>
      <p class="text-gray-500 mt-1">Fédération Tunisienne de Natation</p>
    </div>

    <div *ngIf="success" class="bg-green-50 border border-green-200 text-green-700 rounded-lg p-3 mb-4 text-sm">
      Compte créé avec succès ! Redirection…
    </div>
    <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 mb-4 text-sm">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" #regForm="ngForm" *ngIf="!success">
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Prénom</label>
          <input type="text" [(ngModel)]="form.firstName" name="firstName" required
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
          <input type="text" [(ngModel)]="form.lastName" name="lastName" required
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" [(ngModel)]="form.email" name="email" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input type="password" [(ngModel)]="form.password" name="password" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Rôle</label>
        <select [(ngModel)]="form.role" name="role"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ATHLETE">Athlète</option>
          <option value="COACH">Entraîneur</option>
        </select>
      </div>

      <button type="submit" [disabled]="loading || !regForm.valid"
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-semibold py-2.5 rounded-lg transition-colors">
        {{ loading ? 'Création…' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Déjà un compte ? <a routerLink="/auth/login" class="text-blue-600 hover:underline">Se connecter</a>
    </p>
  </div>
</div>
