<div class="container" style="padding-top: 32px; padding-bottom: 64px; max-width: 1280px; margin: 0 auto; padding-left: 32px; padding-right: 32px;">
  <h1 style="font-size: 32px; font-weight: 800; color: #202124; margin-bottom: 8px;">{{ 'pools.map.title' | translate }}</h1>
  <p style="color: #5f6368; margin-bottom: 32px;">{{ 'pools.map.subtitle' | translate }}</p>
  <div class="skeleton-module">
    <div style="font-size: 48px;"><lucide-icon [img]="Map" class="w-12 h-12"></lucide-icon></div>
    <h2>{{ 'pools.map.inDevelopment' | translate }}</h2>
    <p>{{ 'pools.map.comingSoon' | translate }}</p>
  </div>
</div>
